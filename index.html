<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIFU Online Test</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css?v=2">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><img src="assets/logo.png" alt="AIFU"><div><b data-t="subject"></b><small data-t="topic"></small></div></div>
    <div class="grow"></div>
    <div id="timer" class="timer hidden" role="timer" aria-live="off">60:00</div>
    <div id="student" class="student hidden"><span class="avatar" id="ava"></span><div><b id="sName"></b><small id="sGroup"></small></div></div>
    <div class="lang" id="lang"><button data-l="uz">UZ</button><button data-l="ru">RU</button><button data-l="en">EN</button></div>
  </div>
</header>
<main class="wrap" id="app" aria-live="polite"></main>
<script src="config.js?v=2"></script>
<script src="assets/i18n.js?v=2"></script>
<script src="assets/validate.js?v=2"></script>
<script src="assets/app.js?v=2"></script>
</body>
</html>
